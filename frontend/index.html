    <!-- ═══ Critical Resource Hints ═══════════════════════════════════════ -->
    <!-- Preload the LCP hero image so the browser fetches it at the highest priority,
         before any CSS or JS is parsed. This is the single biggest LCP win. -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/hero-image.webp"
      fetchpriority="high"
    />

    <!-- Preload critical fonts - only preload actually used weights -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Fraunces-700.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Inter-400.woff2"
      crossorigin
    />
    <!-- Preload additional Inter weights to prevent font swap CLS in footer -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Inter-500.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Inter-600.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Inter-700.woff2"
      crossorigin
    />

    <!-- Preload LCP hero image to reduce load delay (SPA without SSR) -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/culture-2.webp"
      fetchpriority="high"
    />

    <!-- Critical CSS - Inlined to prevent render-blocking -->
    <style>
      @font-face {
        font-family: 'Fraunces';

        font-weight: 700;
        font-display: swap;
        src: url('/assets/fonts/local/Fraunces-700.woff2') format('woff2');

      @font-face {
        font-family: 'Inter';
        font-style: normal;

      html {

        font-family: "Inter", sans-serif;
        color: #2A0A14;
        background-color: rgb(248 233 206);
      }
      body {
        overflow-x: hidden;
        text-align: justify;
      }
      a, button, input[type="submit"], input[type="button"], [role="button"], [onclick], [role="link"] {
        cursor: pointer;
      }
      .sigma_preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(248 233 206);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .sigma_preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .sigma_preloader-img {
        max-width: 60vw;
        max-height: 60vh;
        width: auto;
        height: auto;
        object-fit: contain;
        animation: preloader-pulse 1.2s ease-in-out infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.85; }
      }
      @media (min-width: 768px) {
        .sigma_preloader-img { max-width: 320px; max-height: 320px; }
      }
      @media (min-width: 1024px) {
        .sigma_preloader-img { max-width: 414px; max-height: 414px; }
      }
    </style>
