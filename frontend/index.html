<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ Critical Resource Hints ═══════════════════════════════════════ -->
    <!-- Preload the LCP hero image so the browser fetches it at the highest priority,
         before any CSS or JS is parsed. This is the single biggest LCP win. -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/puja/35.webp"
      imagesrcset="/assets/img/puja/35-480.webp 480w, /assets/img/puja/35-768.webp 768w, /assets/img/puja/35-1280.webp 1280w, /assets/img/puja/35-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/webp" href="/assets/img/Logo-puja.webp" />
    <link rel="apple-touch-icon" href="/assets/img/Logo-puja.webp" />

    <!-- Viewport & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C9559E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Amader Barir Pujo, Pune">
    <meta name="format-detection" content="telephone=no">

    <!-- SEO -->
    <meta name="description" content="Amader Barir Pujo, Pune — Discover devotional services, sacred festivals, and spiritual community programs in our alternate home layout.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Amader Barir Pujo, Pune">
    <meta property="og:description" content="Amader Barir Pujo, Pune — Discover devotional services, sacred festivals, and spiritual community programs in our alternate home layout.">
    <meta property="og:image" content="/assets/img/banner/1.webp">

    <title>Amader Barir Pujo, Pune</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
