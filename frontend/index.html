<!doctype html>

    <!-- ═══ Critical Resource Hints ═══════════════════════════════════════ -->
    <!-- Preload the LCP hero image so the browser fetches it at the highest priority,
         before any CSS or JS is parsed. This is the single biggest LCP win. -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/hero-image.webp"
      fetchpriority="high"
    />

    <!-- Preload critical fonts - only preload actually used weights -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Fraunces-700.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/local/Inter-400.woff2"
      crossorigin
    />
